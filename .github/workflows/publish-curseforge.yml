name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to package and upload
        required: true
        type: string
      release_type:
        description: CurseForge release type
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: read

env:
  ADDON_NAME: PartyRoleIcons
  ADDON_SOURCE: addon/PartyRoleIcons
  CURSEFORGE_BASE_URL: https://wow.curseforge.com
  # Set once as a repository variable, so no file has to be edited when the
  # CurseForge project is created:
  #   gh variable set CURSEFORGE_PROJECT_ID --body "<project id>"
  CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}

jobs:
  publish:
    name: Upload addon package
    runs-on: ubuntu-latest

    steps:
      - name: Check the project is configured
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          missing=0
          if [[ -z "$CURSEFORGE_PROJECT_ID" ]]; then
            echo "Missing CURSEFORGE_PROJECT_ID repository variable." >&2
            missing=1
          fi
          if [[ -z "$CURSEFORGE_API_TOKEN" ]]; then
            echo "Missing CURSEFORGE_API_TOKEN repository secret." >&2
            missing=1
          fi
          if [[ $missing -ne 0 ]]; then
            echo "The GitHub release itself is unaffected: only this upload was skipped." >&2
            exit 1
          fi

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          # Write the changelog outside the workspace so the checkout step below
          # (which cleans the working directory) does not delete it.
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
            prerelease="$(jq -r '.release.prerelease' "$GITHUB_EVENT_PATH")"
            jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/CHANGELOG.md"

            if [[ "$prerelease" == "true" ]]; then
              release_type="beta"
            else
              release_type="release"
            fi
          else
            tag="${{ inputs.tag }}"
            release_type="${{ inputs.release_type }}"
            printf 'Manual CurseForge upload for %s\n' "$tag" > "$RUNNER_TEMP/CHANGELOG.md"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Build addon zip
        shell: bash
        run: |
          rm -rf dist
          mkdir -p "dist/${ADDON_NAME}"
          # The addon lives under addon/<name>/; package only that folder so the
          # zip has a single top-level <name>/ directory as WoW expects.
          rsync -a \
            --exclude='.git/' \
            --exclude='*.zip' \
            "${ADDON_SOURCE}/" "dist/${ADDON_NAME}/"
          cd dist
          zip -r "${ADDON_NAME}-${{ steps.release.outputs.tag }}.zip" "${ADDON_NAME}"

      - name: Prepare CurseForge metadata
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          versions_json="$(curl -sf \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            "${CURSEFORGE_BASE_URL}/api/game/versions")"

          # Resolve a CurseForge game-version id for every flavour TOC in the
          # addon: the base .toc (MoP Classic) plus each _<Flavour>.toc, so
          # _Vanilla.toc for Classic Era. The version comes from the TOC
          # Interface number (50504 -> 5.5.4, 11509 -> 1.15.9). Pinning explicit
          # ids avoids the spurious duplicates CurseForge infers from a TOC alone.
          ids=()
          shopt -s nullglob
          for toc in "${ADDON_SOURCE}/${ADDON_NAME}.toc" "${ADDON_SOURCE}/${ADDON_NAME}"_*.toc; do
            [[ -f "$toc" ]] || continue
            iface="$(grep -iE '^## Interface:' "$toc" | grep -oE '[0-9]+' | head -1)"
            if [[ -z "$iface" ]]; then
              echo "Could not read '## Interface:' from $toc" >&2
              exit 1
            fi
            version_string="$((10#$iface / 10000)).$((10#$iface / 100 % 100)).$((10#$iface % 100))"
            id="$(jq --arg v "$version_string" \
              'map(select(.name == $v)) | .[0].id // empty' <<<"$versions_json")"
            if [[ -z "$id" ]]; then
              echo "No CurseForge game version matches '$version_string' (from $(basename "$toc")). Available versions:" >&2
              jq -r '.[].name' <<<"$versions_json" | sort -uV >&2
              exit 1
            fi
            echo "$(basename "$toc"): interface $iface -> $version_string -> id $id"
            ids+=("$id")
          done

          if [[ ${#ids[@]} -eq 0 ]]; then
            echo "No TOC files found under ${ADDON_SOURCE}." >&2
            exit 1
          fi

          game_versions="$(printf '%s\n' "${ids[@]}" | sort -un | jq -s '.')"

          jq -n \
            --rawfile changelog "$RUNNER_TEMP/CHANGELOG.md" \
            --arg displayName "${{ steps.release.outputs.tag }}" \
            --arg releaseType "${{ steps.release.outputs.release_type }}" \
            --argjson gameVersions "$game_versions" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersions: $gameVersions,
              releaseType: $releaseType
            }' > metadata.json

          echo "metadata.json:"; jq '.gameVersions, .displayName' metadata.json

      - name: Upload to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          curl --fail-with-body \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form "metadata=<metadata.json;type=application/json" \
            --form "file=@dist/${ADDON_NAME}-${{ steps.release.outputs.tag }}.zip" \
            "${CURSEFORGE_BASE_URL}/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file"
